[package]
name = "yuuki-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"
unicode-segmentation = "1"
async-channel = "2"

[profile.release]
debug = 1
