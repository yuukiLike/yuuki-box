<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>音乐空间</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><a class="brand" href="/">MUSIC <i>/</i> SPACE</a><span class="local">本地音乐实验</span><select id="scene-select" aria-label="切换场景"></select></header>
  <main>
    <aside>
      <p class="eyebrow" id="mode-label">音乐与空间</p><h1 id="title">正在打开场景</h1><p class="description" id="description"></p>
      <section><h2>声部 <span id="track-count"></span></h2><div id="tracks"></div><button id="all-tracks" class="quiet">听全部声部</button></section>
      <section id="score-controls"><h2>环绕声部之结</h2><p class="hint">整段音乐折成一个结。时间沿环前进，声部交织，休止留下空隙。拖动环绕，滚轮靠近。</p><button id="follow" class="quiet">回到默认视角</button><button id="model" class="quiet">保存三维模型 GLB</button><div id="bars" class="bars"></div><div id="repeats" class="repeats"></div></section>
      <section id="photo-controls" hidden><h2>舞台的距离</h2><label>图层间距 <input id="depth" type="range" min="0" max="2" step="0.05"></label><label>运镜幅度 <input id="travel" type="range" min="0" max="0.8" step="0.02"></label><p class="hint" id="depth-source"></p><h2>场次与灯光</h2><div id="cues"></div></section>
      <section class="actions"><button id="save" class="quiet">保存场景配置</button><button id="export" class="quiet">导出当前位置 4 秒</button><p id="message" role="status"></p></section>
    </aside>
    <div class="stage-column"><div id="stage"><div class="stage-top"><span>MUSIC AS MATTER</span><span id="chapter"></span></div><div id="capture-label"><div><span class="stage-caption">A STUDY IN SOUND &amp; SPACE</span><span id="capture-title"></span></div><div class="stage-meta"><span id="capture-tracks"></span><span><b id="active-count">00</b> <span id="active-unit">ACTIVE NOTES</span></span></div></div></div><div class="transport"><button id="play" aria-label="播放音乐">播放</button><span id="time">00:00</span><input id="seek" aria-label="音乐位置" type="range" min="0" step="0.01"><span id="duration">00:00</span><span id="bar-label"></span><div class="meter"><i id="meter"></i></div></div></div>
  </main><script type="module" src="/viewer.js"></script>
</body></html>
