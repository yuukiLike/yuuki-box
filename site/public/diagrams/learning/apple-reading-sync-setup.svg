<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img" aria-labelledby="title desc">
  <title id="title">从开发者配置到跨设备同步的开通路径</title>
  <desc id="desc">按五步开通：确认会员与符合条件的已上架 App；创建网站 Services ID，登记 box.yuuki.page 与精确回调；准备 Apple 私钥和本站会话密钥；绑定 D1、应用迁移并部署 Functions；先检查会话接口，再完成两台设备的真实账号验证。没有关联 App 时先补齐条件，本地阅读不受影响。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#72967b"/></marker></defs>
  <rect width="960" height="1320" rx="20" fill="#f6f8f5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#243d30">
    <text x="40" y="52" font-size="29" font-weight="600">开通路径：Apple 配置 → 云端部署 → 真实验收</text>
    <text x="40" y="88" font-size="19" fill="#52695b">步骤示意；框内填过配置，不等于已经完成真实登录与同步。</text>
    <g fill="none" stroke="#72967b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M70 198V345"/><path d="M70 396V574"/><path d="M70 625V788"/><path d="M70 839V1049"/>
    </g>
    <g fill="#dcebdc" stroke="#72967b"><circle cx="70" cy="172" r="25"/><circle cx="70" cy="370" r="25"/><circle cx="70" cy="600" r="25"/><circle cx="70" cy="814" r="25"/><circle cx="70" cy="1075" r="25"/></g>
    <g text-anchor="middle" font-size="21" font-weight="600"><text x="70" y="180">01</text><text x="70" y="378">02</text><text x="70" y="608">03</text><text x="70" y="822">04</text><text x="70" y="1083">05</text></g>
    <rect x="115" y="127" width="805" height="143" rx="15" fill="#dcebdc" stroke="#72967b"/>
    <text x="139" y="166" font-size="25" font-weight="600">先确认 Apple 接入条件</text>
    <text x="139" y="204" font-size="21">开发者会员 + 已上架、支持 Apple 登录的关联 App</text>
    <text x="139" y="240" font-size="20">确认主 App ID；普通阅读者只需要自己的 Apple 账号。</text>
    <rect x="115" y="313" width="805" height="187" rx="15" fill="#e3eef5" stroke="#87aabd"/>
    <text x="139" y="353" font-size="25" font-weight="600">创建网站 Services ID，关联同一主 App ID</text>
    <text x="139" y="392" font-size="21">Domains and Subdomains：box.yuuki.page</text>
    <text x="139" y="429" font-size="20">Return URLs：</text>
    <text x="139" y="466" font-size="20">https://box.yuuki.page/api/reading/callback</text>
    <rect x="115" y="545" width="805" height="159" rx="15" fill="#e8eee8" stroke="#a4b8aa"/>
    <text x="139" y="585" font-size="25" font-weight="600">准备 Apple 凭证与站内会话密钥</text>
    <text x="139" y="625" font-size="21">Services ID / Team ID / Key ID → 后端变量</text>
    <text x="139" y="665" font-size="21">.p8 私钥 + SESSION_SECRET → 后端 Secrets</text>
    <rect x="115" y="750" width="805" height="218" rx="15" fill="#f1e9d7" stroke="#b5a27a"/>
    <text x="139" y="790" font-size="25" font-weight="600">绑定 D1，再将页面和 Functions 一起部署</text>
    <text x="139" y="830" font-size="21">READING_DB → 阅读数据库 → 应用表迁移</text>
    <text x="139" y="870" font-size="21">SITE_ORIGIN = https://box.yuuki.page（无末尾斜杠）</text>
    <text x="139" y="910" font-size="21">从 site/ 运行 Wrangler，发布到对应 Pages 生产分支。</text>
    <text x="139" y="944" font-size="19" fill="#735d32">控制台只拖拽 dist/，不会编译本项目的 functions/。</text>
    <rect x="115" y="1014" width="805" height="177" rx="15" fill="#dcebdc" stroke="#72967b"/>
    <text x="139" y="1054" font-size="25" font-weight="600">先查接口，再做两台设备的真实验证</text>
    <text x="139" y="1094" font-size="21">GET /api/reading/session → 检查 JSON 与 enabled</text>
    <text x="139" y="1133" font-size="21">真实 Apple 授权 → 同账号合并 → 不同账号隔离</text>
    <text x="139" y="1167" font-size="19">enabled: true 只说明配置条件满足，还需要实际完成授权。</text>
    <rect x="40" y="1231" width="880" height="54" rx="12" fill="#fff" stroke="#a4b8aa"/>
    <text x="480" y="1266" text-anchor="middle" font-size="20">没有可关联的 App？先补齐 Apple 条件，本地阅读进度仍照常保存。</text>
  </g>
</svg>
