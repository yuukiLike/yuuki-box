<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">一条消息在增长，历史为什么重算？</title>
<desc id="desc">一条消息在增长，历史为什么重算？。先确认最终内容一致，再比解析次数与输入响应；少显示内容不能算优化。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="450" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">一条消息在增长，历史为什么重算？</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">在相同最终文本下，比较被处理的范围。</text>
<rect x="40" y="134" width="464" height="222" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#806014" font-weight="650">朴素路径：每次处理全部</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">新文本到达后遍历全部历史</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">已完成代码块反复解析</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">一条消息变化牵动大范围更新</text><text x="62" y="306" font-size="20" fill="#455164" font-weight="400">历史越长，重复工作越多</text><rect x="536" y="134" width="464" height="222" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="558" y="176" font-size="24" fill="#23674a" font-weight="650">优化路径：区分历史与活动</text><text x="558" y="216" font-size="20" fill="#455164" font-weight="400">完成块按内容版本复用</text><text x="558" y="246" font-size="20" fill="#455164" font-weight="400">活动消息保留独立更新边界</text><text x="558" y="276" font-size="20" fill="#455164" font-weight="400">历史编辑、字体或宽度变化时</text><text x="558" y="306" font-size="20" fill="#455164" font-weight="400">按真实依赖使对应缓存失效</text><text x="40" y="405" font-size="21" fill="#455164" font-weight="400">先确认最终内容一致，再比解析次数与输入响应；少显示内容不能算优化。</text>
</g></svg>
