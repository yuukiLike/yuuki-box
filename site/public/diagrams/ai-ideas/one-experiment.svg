<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">构想的最小验证实验</title>
<desc id="desc">构想的最小验证实验。公开案例提供候选方法；本项目是否适用，须由目标项目的对照结果验证。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">构想的最小验证实验</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">先选择一个能判断结果的问题，再考虑持续自动化。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">输入固定</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">一个错误或一份资料</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">明确可操作范围</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">保留版本与原始样本</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">只改变一个环节</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">一个假设或一项策略</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">规定停止条件</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">保留失败和未完成项</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">依据结果决策</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">是否达到验收条件？</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">多花了哪些成本？</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">继续、收窄或停止</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">公开案例提供候选方法；本项目是否适用，须由目标项目的对照结果验证。</text>
</g></svg>
