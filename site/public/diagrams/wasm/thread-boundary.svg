<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">计算格式与执行线程分别选择</title>
<desc id="desc">计算格式与执行线程分别选择。Wasm 不会自动创建后台线程；是否更快要比较同一份工作。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="450" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">计算格式与执行线程分别选择</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">Wasm 描述如何执行计算；Worker 决定把工作放在哪条线程。</text>
<rect x="40" y="134" width="464" height="222" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#806014" font-weight="650">主线程调用 Wasm</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">JavaScript → Wasm → 返回结果</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">同步计算仍占用主线程</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">长任务期间输入和绘制会等待</text><text x="62" y="306" font-size="20" fill="#455164" font-weight="400">适合短小、可控的计算</text><rect x="536" y="134" width="464" height="222" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="558" y="176" font-size="24" fill="#23674a" font-weight="650">Worker 中调用 JS 或 Wasm</text><text x="558" y="216" font-size="20" fill="#455164" font-weight="400">主线程发送任务和数据</text><text x="558" y="246" font-size="20" fill="#455164" font-weight="400">Worker 计算后发回结果</text><text x="558" y="276" font-size="20" fill="#455164" font-weight="400">UI 只接收当前任务的结果</text><text x="558" y="306" font-size="20" fill="#455164" font-weight="400">还要计算通信与搬运成本</text><text x="40" y="405" font-size="21" fill="#455164" font-weight="400">Wasm 不会自动创建后台线程；是否更快要比较同一份工作。</text>
</g></svg>
