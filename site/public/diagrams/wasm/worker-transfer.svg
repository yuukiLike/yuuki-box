<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">数据怎么去，结果怎么回来</title>
<desc id="desc">数据怎么去，结果怎么回来。取消消息要等 Worker 处理；同步长循环需要切块让出执行机会。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="670" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">数据怎么去，结果怎么回来</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">数据搬运与任务新旧判断需要分别处理。</text>
<text x="40" y="133" font-size="21" fill="#245b86" font-weight="650">传输：用 transfer list 移交 ArrayBuffer</text><rect x="40" y="148" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="190" font-size="24" fill="#245b86" font-weight="650">主线程持有数据</text><text x="62" y="230" font-size="20" fill="#455164" font-weight="400">构造 ArrayBuffer</text><text x="62" y="260" font-size="20" fill="#455164" font-weight="400">附上任务编号</text><path d="M348 238 L364 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="148" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="190" font-size="24" fill="#806014" font-weight="650">转移所有权</text><text x="390" y="230" font-size="20" fill="#455164" font-weight="400">发送 buffer</text><text x="390" y="260" font-size="20" fill="#455164" font-weight="400">发送方的缓冲区分离</text><path d="M676 238 L692 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="148" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="190" font-size="24" fill="#23674a" font-weight="650">Worker 使用数据</text><text x="718" y="230" font-size="20" fill="#455164" font-weight="400">接收方获得缓冲区</text><text x="718" y="260" font-size="20" fill="#455164" font-weight="400">计算后返回结果</text><text x="40" y="379" font-size="21" fill="#245b86" font-weight="650">更新：任务 7 的结果迟于任务 8</text><rect x="40" y="394" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="436" font-size="24" fill="#245b86" font-weight="650">当前任务是 8</text><text x="62" y="476" font-size="20" fill="#455164" font-weight="400">用户已修改输入</text><path d="M348 484 L364 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="394" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="436" font-size="24" fill="#806014" font-weight="650">收到任务 7</text><text x="390" y="476" font-size="20" fill="#455164" font-weight="400">比较返回的 jobId</text><text x="390" y="506" font-size="20" fill="#455164" font-weight="400">与当前任务编号</text><path d="M676 484 L692 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="394" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="436" font-size="24" fill="#23674a" font-weight="650">丢弃旧结果</text><text x="718" y="476" font-size="20" fill="#455164" font-weight="400">不让旧输出覆盖页面</text><text x="718" y="506" font-size="20" fill="#455164" font-weight="400">任务 8 仍正常更新</text><text x="40" y="625" font-size="21" fill="#455164" font-weight="400">取消消息要等 Worker 处理；同步长循环需要切块让出执行机会。</text>
</g></svg>
