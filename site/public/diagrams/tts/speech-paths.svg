<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">三种语音工具各做一段</title>
<desc id="desc">三种语音工具各做一段。VAD 不负责理解说了什么；拼接语音片段后，时间轴也会发生变化。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="670" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">三种语音工具各做一段</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">先用固定文件跑通；接入实时对话时再处理打断、延迟与设备。</text>
<text x="40" y="133" font-size="21" fill="#245b86" font-weight="650">输出：让文字被听见</text><rect x="40" y="148" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="190" font-size="24" fill="#245b86" font-weight="650">文字</text><text x="62" y="230" font-size="20" fill="#455164" font-weight="400">一句招呼或一段回复</text><path d="M348 238 L364 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="148" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="190" font-size="24" fill="#953959" font-weight="650">TTS 合成</text><text x="390" y="230" font-size="20" fill="#455164" font-weight="400">edge-tts 在线请求</text><text x="390" y="260" font-size="20" fill="#455164" font-weight="400">文字发送到服务端</text><path d="M676 238 L692 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="148" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="190" font-size="24" fill="#23674a" font-weight="650">音频</text><text x="718" y="230" font-size="20" fill="#455164" font-weight="400">保存 MP3</text><text x="718" y="260" font-size="20" fill="#455164" font-weight="400">播放器播放</text><text x="40" y="379" font-size="21" fill="#245b86" font-weight="650">输入：从录音里得到文字</text><rect x="40" y="394" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="436" font-size="24" fill="#245b86" font-weight="650">录音与格式</text><text x="62" y="476" font-size="20" fill="#455164" font-weight="400">采样率、声道与编码</text><text x="62" y="506" font-size="20" fill="#455164" font-weight="400">先转换再交给工具</text><path d="M348 484 L364 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="394" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="436" font-size="24" fill="#953959" font-weight="650">VAD / ASR</text><text x="390" y="476" font-size="20" fill="#455164" font-weight="400">VAD 找人声时间段</text><text x="390" y="506" font-size="20" fill="#455164" font-weight="400">Whisper 转写文字</text><text x="390" y="536" font-size="20" fill="#455164" font-weight="400">可分别使用</text><path d="M676 484 L692 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="394" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="436" font-size="24" fill="#23674a" font-weight="650">可核对的输出</text><text x="718" y="476" font-size="20" fill="#455164" font-weight="400">时间区间与转写文本</text><text x="718" y="506" font-size="20" fill="#455164" font-weight="400">对照原录音检查</text><text x="40" y="625" font-size="21" fill="#455164" font-weight="400">VAD 不负责理解说了什么；拼接语音片段后，时间轴也会发生变化。</text>
</g></svg>
