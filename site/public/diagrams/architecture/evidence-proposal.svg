<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">从研究证据到自己的方案</title>
<desc id="desc">从研究证据到自己的方案。他人的设计能提供问题和候选答案；自己的验收结果决定是否采用。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="450" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">从研究证据到自己的方案</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">先标明资料的时间和适用范围，再决定要验证哪一个选择。</text>
<rect x="40" y="134" width="464" height="222" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">已观察到的材料</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">固定提交、源码与产品文档</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">记录版本和具体调用路径</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">说明已运行与仅阅读的部分</text><text x="62" y="306" font-size="20" fill="#455164" font-weight="400">不能从界面推断全部内部实现</text><rect x="536" y="134" width="464" height="222" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="558" y="176" font-size="24" fill="#23674a" font-weight="650">准备验证的方案</text><text x="558" y="216" font-size="20" fill="#455164" font-weight="400">描述自己的使用场景与约束</text><text x="558" y="246" font-size="20" fill="#455164" font-weight="400">先搭一个可运行的小切片</text><text x="558" y="276" font-size="20" fill="#455164" font-weight="400">比较效果、成本与失败路径</text><text x="558" y="306" font-size="20" fill="#455164" font-weight="400">结果写回选择依据</text><text x="40" y="405" font-size="21" fill="#455164" font-weight="400">他人的设计能提供问题和候选答案；自己的验收结果决定是否采用。</text>
</g></svg>
