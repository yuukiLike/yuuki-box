<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">用一次变化检查架构边界</title>
<desc id="desc">用一次变化检查架构边界。目录分成多个模块，不等于变化已被隔离；要看一次真实改动经过哪里。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">用一次变化检查架构边界</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">选一个具体需求，沿输入、状态和输出追踪影响。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">提出变化</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">换模型或增加工具</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">先写期望行为</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">选一个验收样例</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#806014" font-weight="650">追踪受影响处</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">接口输入与输出</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">状态由谁保存</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">取消和失败向哪传</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">验证边界</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">能否局部替换？</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">哪些调用方要一起改？</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">记录代价和新证据</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">目录分成多个模块，不等于变化已被隔离；要看一次真实改动经过哪里。</text>
</g></svg>
