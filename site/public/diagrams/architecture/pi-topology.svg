<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
<title id="title">PI-Desktop：Main 连接两个 sidecar</title>
<desc id="desc">React 经 preload 连接 Electron Main。Main 分别经 stdio 连接 Rust host 和 Node Agent。Node 的 host.proxy 回到 Main，Rust 保存 JSONL 正文与 SQLite 索引。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="680" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">PI-Desktop：Main 连接两个 sidecar</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">固定于 2026-09-26 的调查工作树；这张图不是 Yuuki 当前进程结构。</text>
<rect x="40" y="140" width="264" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="182" font-size="24" fill="#245b86" font-weight="650">React 界面</text><text x="62" y="222" font-size="20" fill="#455164" font-weight="400">通过 preload</text><text x="62" y="252" font-size="20" fill="#455164" font-weight="400">发送白名单 IPC</text><text x="62" y="282" font-size="20" fill="#455164" font-weight="400">显示事件与状态</text><rect x="388" y="140" width="264" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="410" y="182" font-size="24" fill="#953959" font-weight="650">Electron Main</text><text x="410" y="222" font-size="20" fill="#455164" font-weight="400">启动与监督子进程</text><text x="410" y="252" font-size="20" fill="#455164" font-weight="400">分发请求和事件</text><text x="410" y="282" font-size="20" fill="#455164" font-weight="400">管理持久化 outbox</text><rect x="736" y="140" width="264" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="758" y="182" font-size="24" fill="#23674a" font-weight="650">Node / pi Agent</text><text x="758" y="222" font-size="20" fill="#455164" font-weight="400">执行模型循环</text><text x="758" y="252" font-size="20" fill="#455164" font-weight="400">工具经 host.proxy</text><text x="758" y="282" font-size="20" fill="#455164" font-weight="400">回到 Main 分派</text><path d="M308 215 L380 215" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 245 L308 245" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 215 L728 215" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><path d="M728 245 L660 245" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="388" y="406" width="264" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="410" y="448" font-size="24" fill="#806014" font-weight="650">Rust host-core</text><text x="410" y="488" font-size="20" fill="#455164" font-weight="400">工具权限与本地能力</text><text x="410" y="518" font-size="20" fill="#455164" font-weight="400">JSONL 保存会话正文</text><text x="410" y="548" font-size="20" fill="#455164" font-weight="400">SQLite 保存状态索引</text><path d="M500 328 L500 398" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 398 L540 328" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><text x="566" y="367" font-size="18" fill="#455164" font-weight="400">stdio RPC</text><text x="40" y="460" font-size="19" fill="#455164" font-weight="400">图为本地 Desktop 主路径。</text><text x="40" y="493" font-size="19" fill="#455164" font-weight="400">native Pi 与远程分支</text><text x="40" y="526" font-size="19" fill="#455164" font-weight="400">有各自的记录与协议。</text><text x="708" y="460" font-size="18" fill="#455164" font-weight="400">Main 分别连接两个 sidecar；</text><text x="708" y="493" font-size="18" fill="#455164" font-weight="400">Rust 不直接启动 Node。</text><text x="40" y="638" font-size="21" fill="#455164" font-weight="400">受理确认、任务完成与数据落盘是不同事实，不能用一个 accepted 代替。</text>
</g></svg>
