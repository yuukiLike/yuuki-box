<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">从真实文本到可编辑的屏幕片段</title>
<desc id="desc">从真实文本到可编辑的屏幕片段。编辑屏幕片段时，要映射回真实文本；显示坐标不能直接当文件坐标。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">从真实文本到可编辑的屏幕片段</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">这是职责概览；完整类型、调用与版本见正文的固定源码。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">文本与版本</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">Rope 保存分块文本</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">text::Buffer 管编辑</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">language::Buffer 加语法</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">片段与交互</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">MultiBuffer 组织片段</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">保留原 Buffer 的身份</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">Editor 管输入与选区</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">显示与绘制</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">DisplayMap 转换坐标</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">折叠、换行不删原文</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">GPUI 提交绘制</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">编辑屏幕片段时，要映射回真实文本；显示坐标不能直接当文件坐标。</text>
</g></svg>
