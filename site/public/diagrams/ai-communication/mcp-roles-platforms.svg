<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2080" viewBox="0 0 1200 2080" role="img" aria-labelledby="mcp-title mcp-desc">
  <title id="mcp-title">MCP 全景：用户、Host、Client、Server 与接入平台</title>
  <desc id="mcp-desc">用户操作 Host。Host 管理对话、模型、权限和工具调用，其内部为每个 MCP Server 建立一个 Client 连接。模型通过模型 API 与 Host 沟通，提出工具调用；Host 检查后，由 Client 通过 MCP 请求 Server。Server 操作实际的文件、浏览器或业务系统，再把结果返回。Codex、Zed、Warp、Raycast 在接入外部 MCP 时都是 Host；它们可以各自连接同一个远程 Server。常见 Server 包括 GitHub、Context7、Playwright、Figma、Sentry 和 Filesystem。本图核对于 2026 年 10 月 26 日。</desc>
  <defs>
    <marker id="mcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mcp-arrowhead" d="M0 0 10 5 0 10z"/></marker>
    <marker id="model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="model-arrowhead" d="M0 0 10 5 0 10z"/></marker>
    <marker id="user-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="user-arrowhead" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <style>
    svg { color-scheme: light dark; }
