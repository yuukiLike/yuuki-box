  <rect class="band" x="44" y="1972" width="1112" height="64" rx="14"/>
  <text class="body blue" x="600" y="2013" text-anchor="middle">结果回到 Host → 交给模型继续回答 → 由应用展示给你</text>
  <text class="small muted" x="44" y="2062">概念图 · 平台支持核对于 2026-10-26 · 原图中的平台与服务卡片可点击查看官方资料</text>
</svg>
