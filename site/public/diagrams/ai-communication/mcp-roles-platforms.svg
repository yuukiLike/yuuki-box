  <rect class="server" x="332" y="1418" width="536" height="66" rx="14"/>
  <text class="label green" x="600" y="1460" text-anchor="middle">同一个远程 Server · 例如 GitHub MCP</text>
  <text class="body muted" x="44" y="1524">四条独立连接；每个平台分别管理自己的配置、账号授权与会话。</text>

  <line class="rule" x1="44" y1="1558" x2="1156" y2="1558"/>
  <text class="section" x="44" y="1610">03 · 当前常见的 MCP Server：按能力认识它们</text>
  <text class="body muted" x="44" y="1646">以下为服务示例，不按热度排名；Tools / Resources / Prompts 以双方支持为准。</text>
