    .client { fill: #ffffff; stroke: #91acd0; stroke-width: 1.5; }
    .server { fill: #edf7f2; stroke: #85ad99; stroke-width: 1.5; }
    .model { fill: #f3effa; stroke: #a797be; stroke-width: 1.5; }
    .note { fill: #faf4e8; stroke: #d9c7a3; stroke-width: 1.5; }
    .band { fill: #e6eef8; }
    .rule { stroke: #d6e0ea; stroke-width: 1.5; }
    .title { font-size: 36px; font-weight: 650; letter-spacing: -.7px; }
    .section { font-size: 28px; font-weight: 650; }
    .heading { font-size: 26px; font-weight: 600; }
    .label { font-size: 23px; font-weight: 600; }
    .body { font-size: 21px; }
    .small { font-size: 18px; }
    .muted { fill: #53667b; }
    .blue { fill: #345f93; }
    .green { fill: #316d53; }
    .purple { fill: #72568f; }
    .mcp-line, .model-line, .user-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .mcp-line { stroke: #467b64; }
    .model-line { stroke: #80649c; stroke-dasharray: 7 6; }
    .user-line { stroke: #63788f; }
    .mcp-arrowhead { fill: #467b64; }
    .model-arrowhead { fill: #80649c; }
    .user-arrowhead { fill: #63788f; }
    a { text-decoration: none; }
    a:hover .card, a:hover .server { stroke: #416f9e; stroke-width: 2.5; }
    a:focus-visible { outline: 3px solid #416f9e; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e7edf6; }
      .canvas { fill: #111b29; }
      .card { fill: #192638; stroke: #3b4e65; }
      .host { fill: #1b304c; stroke: #648ab9; }
      .client { fill: #213a59; stroke: #6689b4; }
      .server { fill: #19392e; stroke: #5f947b; }
      .model { fill: #342a46; stroke: #9f87bb; }
      .note { fill: #393124; stroke: #8f7b52; }
      .band { fill: #22364e; }
      .rule { stroke: #3b4e65; }
      .muted { fill: #b2c0d1; }
      .blue { fill: #b6d2fa; }
      .green { fill: #b0ddc4; }
      .purple { fill: #d4beec; }
      .mcp-line { stroke: #9bceb3; }
      .model-line { stroke: #c7aadd; }
      .user-line { stroke: #afc1d6; }
      .mcp-arrowhead { fill: #9bceb3; }
      .model-arrowhead { fill: #c7aadd; }
      .user-arrowhead { fill: #afc1d6; }
      a:hover .card, a:hover .server { stroke: #b6d2fa; }
      a:focus-visible { outline-color: #b6d2fa; }
