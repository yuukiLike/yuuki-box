  <rect class="canvas" width="1200" height="2080" rx="24"/>
  <text class="title" x="44" y="65">MCP 全景：你、AI 应用与外部能力</text>
  <text class="body muted" x="44" y="104">先认清谁负责什么，再看 Codex、Zed、Warp、Raycast 放在哪里。</text>
  <rect class="band" x="44" y="132" width="1112" height="66" rx="14"/>
  <text class="heading blue" x="600" y="175" text-anchor="middle">你说目标 · Host 安排 · Client 连接 · Server 执行</text>

  <text class="section" x="44" y="252">01 · 角色与连接：Client 在 Host 里面</text>
  <text class="body muted" x="44" y="288">这里画一个 Host 接入三个 Server；Server 可以运行在本机，也可以运行在远程。</text>

  <!-- Host is an application boundary, not a separate machine or an LLM. -->
  <rect class="host" x="280" y="320" width="510" height="680" rx="20"/>
  <text class="heading blue" x="308" y="364">Host · 你使用的 AI 应用</text>
  <text class="body muted" x="308" y="402">管理对话、模型、权限与工具调用</text>
  <rect class="card" x="308" y="434" width="454" height="102" rx="12"/>
  <text class="label" x="330" y="474">应用的工具调度</text>
  <text class="body muted" x="330" y="510">接收调用建议，检查后安排执行</text>

  <rect class="card" x="44" y="434" width="186" height="184" rx="16"/>
  <text class="heading" x="64" y="477">用户 · 你</text>
  <text class="small muted" x="64" y="515">提出目标与要求</text>
  <text class="small muted" x="64" y="551">连接账号与授权</text>
  <text class="small muted" x="64" y="587">查看调用和结果</text>
  <path class="user-line" d="M232 486H277" marker-end="url(#user-arrow)"/>
  <text class="small muted" x="254" y="469" text-anchor="middle">任务</text>
  <path class="user-line" d="M278 550H233" marker-end="url(#user-arrow)"/>
  <text class="small muted" x="254" y="577" text-anchor="middle">结果</text>

  <!-- Model traffic uses the model API; the MCP links below are separate. -->
  <rect class="model" x="944" y="320" width="212" height="116" rx="14"/>
  <text class="label purple" x="1050" y="365" text-anchor="middle">模型 · LLM</text>
  <text class="small muted" x="1050" y="402" text-anchor="middle">提出调用、组织回答</text>
  <path class="model-line" d="M794 378H940" marker-start="url(#model-arrow)" marker-end="url(#model-arrow)"/>
  <text class="body purple" x="867" y="350" text-anchor="middle">模型 API</text>
  <text class="small muted" x="867" y="410" text-anchor="middle">另一条连接</text>

  <text class="body blue" x="308" y="571">MCP Client · Host 内部的连接组件</text>
  <rect class="client" x="308" y="590" width="454" height="104" rx="12"/>
  <text class="label blue" x="330" y="632">Client A</text>
  <text class="body muted" x="330" y="669">发现工具、发出请求、接收结果</text>
  <rect class="client" x="308" y="722" width="454" height="104" rx="12"/>
  <text class="label blue" x="330" y="764">Client B</text>
  <text class="body muted" x="330" y="801">发现工具、发出请求、接收结果</text>
  <rect class="client" x="308" y="854" width="454" height="104" rx="12"/>
  <text class="label blue" x="330" y="896">Client C</text>
  <text class="body muted" x="330" y="933">发现工具、发出请求、接收结果</text>
  <text class="small muted" x="308" y="983">每个 Client 负责自己那条 Server 连接。</text>

  <!-- Each pair of arrows represents a separate MCP client/server connection. -->
  <g text-anchor="middle">
    <path class="mcp-line" d="M766 642H940" marker-start="url(#mcp-arrow)" marker-end="url(#mcp-arrow)"/>
    <text class="label green" x="855" y="616">MCP</text>
    <text class="small muted" x="855" y="678">stdio · 本机</text>
    <path class="mcp-line" d="M766 774H940" marker-start="url(#mcp-arrow)" marker-end="url(#mcp-arrow)"/>
    <text class="label green" x="855" y="748">MCP</text>
    <text class="small muted" x="855" y="810">HTTP · 远程</text>
    <path class="mcp-line" d="M766 906H940" marker-start="url(#mcp-arrow)" marker-end="url(#mcp-arrow)"/>
    <text class="label green" x="855" y="880">MCP</text>
    <text class="small muted" x="855" y="942">stdio · 本机</text>
  </g>
  <rect class="server" x="944" y="590" width="212" height="104" rx="14"/>
  <text class="small green" x="962" y="618">Server A · 本机进程</text>
  <text class="label" x="962" y="650">Playwright</text>
  <text class="small muted" x="962" y="678">执行 → 操作浏览器</text>
  <rect class="server" x="944" y="722" width="212" height="104" rx="14"/>
  <text class="small green" x="962" y="750">Server B · 远程服务</text>
  <text class="label" x="962" y="782">GitHub</text>
  <text class="small muted" x="962" y="810">执行 → GitHub API</text>
  <rect class="server" x="944" y="854" width="212" height="104" rx="14"/>
  <text class="small green" x="962" y="882">Server C · 本机进程</text>
  <text class="label" x="962" y="914">你的「接着做」</text>
  <text class="small muted" x="962" y="942">执行 → 本地笔记</text>

  <rect class="note" x="44" y="714" width="186" height="186" rx="14"/>
  <text class="small muted" x="64" y="751">这次写哪一块？</text>
  <text class="body" x="64" y="790">通常写 Server</text>
  <text class="small muted" x="64" y="828">Client 由你选择的</text>
  <text class="small muted" x="64" y="860">平台提供和管理</text>
  <text class="body muted" x="44" y="1040">Server 是提供 MCP 接口的程序；实际操作发生在它连接的文件、浏览器或业务系统中。</text>

  <line class="rule" x1="44" y1="1078" x2="1156" y2="1078"/>
  <text class="section" x="44" y="1130">02 · 这四个平台：都可以作为 Host 接入 MCP</text>
  <text class="body muted" x="44" y="1166">「支持 MCP」在这里表示：应用带有 Client，能连接你配置的 Server。</text>

