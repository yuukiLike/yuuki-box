<svg xmlns="http://www.w3.org/2000/svg" width="760" height="890" viewBox="0 0 760 890" role="img" aria-labelledby="title desc">
<title id="title">MCP：一次调用怎样走到文件</title>
<desc id="desc">2026-07-28 版本的逻辑调用时序。SDK 用 server/discover 查询版本与能力；客户端 tools/list 获取工具清单，tools/call 调用 save_checkpoint。服务重建后，SDK 再查服务信息，客户端调用 resume 读取同一磁盘文件。省略请求 ID、元数据和 SDK 的短暂版本探测进程。</desc>
