<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
<title id="title">托盘壁厚与底厚：3 mm</title>
<desc id="desc">俯视外盒 80 乘 50，挖空区域 74 乘 44，因此四周各 3 毫米。剖面外盒中心 Z=6 高12，范围0至12；挖空盒中心 Z=9 高12，范围3至15，留下3毫米底并穿出顶部。加宽到100时，将挖空宽度同时改为94可保持3毫米侧壁。</desc>
<rect width="760" height="960" rx="18" fill="#ffffff"/>
<text x="32" y="49" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="650" fill="#20324d" text-anchor="start">托盘壁厚与底厚：3 mm</text>
<text x="32" y="86" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start">两只长方体：外盒保留材料，内盒挖出空间。</text>
<rect x="24" y="120" width="712" height="342" rx="12" fill="#f4f7fb" stroke="#d2dce8" stroke-width="1.5"/>
<text x="44" y="155" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#20324d" text-anchor="start">俯视：四周的厚度由两组尺寸共同决定</text>
<rect x="64" y="205" width="360" height="225" fill="#dce9fb" stroke="#6d91c4" stroke-width="2"/>
<rect x="77.5" y="218.5" width="333" height="198" fill="#ffffff" stroke="#c49b45" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="64,200 64,191 424,191 424,200" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="244" y="185" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#20324d" text-anchor="middle">80 mm</text>
<polyline points="434,205 451,205 451,430 434,430" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="460" y="353" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#20324d" text-anchor="start">50 mm</text>
<text x="244" y="311" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" fill="#20324d" text-anchor="middle">74 × 44 mm</text>
<text x="244" y="345" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="400" fill="#76551d" text-anchor="middle">挖空区域</text>
<text x="530" y="244" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#20324d" text-anchor="start">侧壁</text>
<text x="530" y="283" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#20324d" text-anchor="start">(80 − 74) ÷ 2</text>
<text x="530" y="322" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#275b40" text-anchor="start">= 3 mm</text>
<text x="530" y="375" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="400" fill="#20324d" text-anchor="start">前后同理</text>
<text x="530" y="407" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#20324d" text-anchor="start">(50 − 44) ÷ 2</text>
<rect x="24" y="488" width="712" height="294" rx="12" fill="#f4f7fb" stroke="#d2dce8" stroke-width="1.5"/>
<text x="44" y="523" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#20324d" text-anchor="start">剖面：挖空从 Z=3 开始，并伸出顶部</text>
<polygon points="64,580 77.5,580 77.5,661 410.5,661 410.5,580 424,580 424,688 64,688" fill="#dce9fb" stroke="#6d91c4" stroke-width="1.8"/>
<rect x="77.5" y="553" width="333" height="108" fill="#fff4d9" fill-opacity="0.7" stroke="#c49b45" stroke-width="2" stroke-dasharray="7 5"/>
<text x="244" y="604" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#76551d" text-anchor="middle">挖空盒子</text>
<text x="244" y="637" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#76551d" text-anchor="middle">中心 Z=9，高 12</text>
<polyline points="433,553 459,553" fill="none" stroke="#8193ac" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="470" y="559" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start">Z=15</text>
<polyline points="433,580 459,580" fill="none" stroke="#8193ac" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="470" y="586" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start">Z=12</text>
<polyline points="433,661 459,661" fill="none" stroke="#8193ac" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="470" y="667" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start">Z=3</text>
<polyline points="433,688 459,688" fill="none" stroke="#8193ac" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="470" y="694" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#52657c" text-anchor="start">Z=0</text>
<text x="571" y="624" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#20324d" text-anchor="start">留下底厚</text>
<text x="571" y="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="600" fill="#275b40" text-anchor="start">3 mm</text>
<text x="44" y="743" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#20324d" text-anchor="start">挖空盒子的底部：9 − 12 ÷ 2 = 3 mm</text>
<rect x="24" y="810" width="712" height="104" rx="12" fill="#e9f6ef" stroke="#91bda4" stroke-width="1.5"/>
<text x="44" y="845" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#275b40" text-anchor="start">参数实验：外宽 100 mm，挖空宽度 94 mm</text>
<text x="44" y="877" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#275b40" text-anchor="start">两处一起加宽 20 mm，左右侧壁仍为 3 mm。</text>
<text x="32" y="943" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="400" fill="#52657c" text-anchor="start">尺寸由示例参数推导；剖面横纵比例不同，按标注读数。</text>
</svg>
