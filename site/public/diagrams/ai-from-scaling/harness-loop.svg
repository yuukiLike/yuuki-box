<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 476" role="img" aria-labelledby="title desc">
<title id="title">追踪一次模型与工具的往返</title>
<desc id="desc">模型提出调用，经 Harness 校验执行，工具结果写入上下文后再请求模型。普通回答、取消、错误或限额结束循环。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="476" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">追踪一次模型与工具的往返</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">对应三个入口：complete 请求模型，runTool 执行工具，emit 记录事件。</text>
<rect x="40" y="140" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="182" font-size="24" fill="#245b86" font-weight="650">模型提出下一步</text><text x="62" y="222" font-size="20" fill="#455164" font-weight="400">本课先用脚本回复</text><text x="62" y="252" font-size="20" fill="#455164" font-weight="400">下一课换真实模型</text><text x="62" y="282" font-size="20" fill="#455164" font-weight="400">正常回答也可能直接结束</text><rect x="368" y="140" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="182" font-size="24" fill="#953959" font-weight="650">Harness 检查与安排</text><text x="390" y="222" font-size="20" fill="#455164" font-weight="400">解析完整参数</text><text x="390" y="252" font-size="20" fill="#455164" font-weight="400">检查工具名与权限</text><text x="390" y="282" font-size="20" fill="#455164" font-weight="400">按轮数与取消信号控制</text><rect x="696" y="140" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="182" font-size="24" fill="#23674a" font-weight="650">工具执行并交回结果</text><text x="718" y="222" font-size="20" fill="#455164" font-weight="400">执行实际函数</text><text x="718" y="252" font-size="20" fill="#455164" font-weight="400">结果绑定 tool_call_id</text><text x="718" y="282" font-size="20" fill="#455164" font-weight="400">失败也返回结构化信息</text><path d="M348 230 L364 230" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><path d="M676 230 L692 230" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><path d="M848 324 V380 H192 V324" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="365" font-size="21" fill="#245b86" font-weight="400">把调用与结果加入下一轮上下文</text><text x="40" y="432" font-size="21" fill="#455164" font-weight="400">模型负责提议；函数由程序执行；终态与用户任务是否完成仍要分别核对。</text>
</g></svg>
