<polyline points="531.0,656.45 538,661 531.0,665.55" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="32" y="747" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="400" fill="#52657c" text-anchor="start">Blender 与 GitHub 可独立选择；两篇工程练习尚未接入 runtime。</text>
