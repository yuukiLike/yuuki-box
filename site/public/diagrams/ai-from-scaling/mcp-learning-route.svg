<svg xmlns="http://www.w3.org/2000/svg" width="800" height="770" viewBox="0 0 800 770" role="img" aria-labelledby="title desc">
<title id="title">MCP：下一步想看清哪件事</title>
<desc id="desc">极简 MCP 是起点。Blender 用参数与模型文件练习外部软件调用；GitHub 用相同断言对照三个版本练习结果验证。通信课复用演示，ToolSource 和权限两课需要另行实现。</desc>
<rect width="800" height="770" rx="18" fill="#ffffff"/>
<text x="32" y="49" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="650" fill="#20324d" text-anchor="start">MCP：下一步想看清哪件事</text>
<text x="32" y="86" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start">先选一个问题，再进入对应实验。</text>
<rect x="210" y="124" width="380" height="104" rx="12" fill="#edf3ff" stroke="#9fb7dd" stroke-width="1.5"/>
<text x="230" y="159" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#2e5185" text-anchor="start">起点：极简 MCP</text>
<text x="230" y="191" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#2e5185" text-anchor="start">发现与调用 / 文件持久化</text>
