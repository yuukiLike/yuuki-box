<title id="title">MCP 学习路线：演示后优先天气</title>
<desc id="desc">最简 MCP 演示后优先实现天气查询。Blender、GitHub 和音乐为选修案例；通信课程复用演示，ToolSource 与权限练习需另行实现。</desc>
