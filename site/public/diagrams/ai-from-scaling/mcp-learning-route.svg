<polyline points="400,258 592,258 592,294" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="596.55,287.0 592,294 587.45,287.0" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="32" y="300" width="352" height="172" rx="12" fill="#edf3ff" stroke="#9fb7dd" stroke-width="1.5"/>
<text x="52" y="335" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2e5185" text-anchor="start">Blender：让参数变成模型</text>
<text x="52" y="367" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#2e5185" text-anchor="start">看尺寸与剖面，核对生成文件</text>
<rect x="48" y="401" width="320" height="54" rx="8" fill="#e9f6ef" stroke="#91bda4" stroke-width="1.5"/>
<text x="64" y="435" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="400" fill="#275b40" text-anchor="start">你做：改尺寸，再检查模型</text>
<rect x="416" y="300" width="352" height="172" rx="12" fill="#edf3ff" stroke="#9fb7dd" stroke-width="1.5"/>
<text x="436" y="335" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2e5185" text-anchor="start">GitHub：核对修复证据</text>
<text x="436" y="367" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#2e5185" text-anchor="start">同一份断言，对照三个版本</text>
<rect x="432" y="401" width="320" height="54" rx="8" fill="#e9f6ef" stroke="#91bda4" stroke-width="1.5"/>
<text x="448" y="435" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="400" fill="#275b40" text-anchor="start">你做：补断言，核对新回执</text>
