<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">选修：音乐数据、模型与导出</title>
<desc id="desc">选修：音乐数据、模型与导出。改变视觉间距，不应改变 MIDI 音符；导出 GLB 与带声音 MP4 是不同产物。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="670" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">选修：音乐数据、模型与导出</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">两个选修场景共享时间轴，数据来源与视觉含义不同。</text>
<text x="40" y="133" font-size="21" fill="#245b86" font-weight="650">钢琴排练台：MIDI 音符与琴键</text><rect x="40" y="148" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="190" font-size="24" fill="#245b86" font-weight="650">MIDI 数据</text><text x="62" y="230" font-size="20" fill="#455164" font-weight="400">音高、起点、时值</text><text x="62" y="260" font-size="20" fill="#455164" font-weight="400">声部、速度与拍号</text><path d="M348 238 L364 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="148" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="190" font-size="24" fill="#953959" font-weight="650">映射为三维琴键</text><text x="390" y="230" font-size="20" fill="#455164" font-weight="400">时间 → 琴键按下时刻</text><text x="390" y="260" font-size="20" fill="#455164" font-weight="400">音高 → 琴键与音名</text><text x="390" y="290" font-size="20" fill="#455164" font-weight="400">力度 → 播放强度</text><path d="M676 238 L692 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="148" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="190" font-size="24" fill="#23674a" font-weight="650">检查同一时刻</text><text x="718" y="230" font-size="20" fill="#455164" font-weight="400">定位小节并独听</text><text x="718" y="260" font-size="20" fill="#455164" font-weight="400">对照画面与原音符</text><text x="718" y="290" font-size="20" fill="#455164" font-weight="400">导出可编辑 GLB</text><text x="40" y="379" font-size="21" fill="#245b86" font-weight="650">舞台预演台：音频包络与布局控制</text><rect x="40" y="394" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="436" font-size="24" fill="#245b86" font-weight="650">音频与图层</text><text x="62" y="476" font-size="20" fill="#455164" font-weight="400">包络描述强弱变化</text><text x="62" y="506" font-size="20" fill="#455164" font-weight="400">图片带透明分层</text><path d="M348 484 L364 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="394" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="436" font-size="24" fill="#953959" font-weight="650">视觉编排</text><text x="390" y="476" font-size="20" fill="#455164" font-weight="400">包络控制部分光效</text><text x="390" y="506" font-size="20" fill="#455164" font-weight="400">关键帧决定镜头与段落</text><text x="390" y="536" font-size="20" fill="#455164" font-weight="400">不自动识别副歌</text><path d="M676 484 L692 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="394" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="436" font-size="24" fill="#23674a" font-weight="650">固定时间逐帧导出</text><text x="718" y="476" font-size="20" fill="#455164" font-weight="400">start + frame / fps</text><text x="718" y="506" font-size="20" fill="#455164" font-weight="400">音频从相同起点截取</text><text x="718" y="536" font-size="20" fill="#455164" font-weight="400">计算慢不改变成片时间</text><text x="40" y="625" font-size="21" fill="#455164" font-weight="400">改变视觉间距，不应改变 MIDI 音符；导出 GLB 与带声音 MP4 是不同产物。</text>
</g></svg>
