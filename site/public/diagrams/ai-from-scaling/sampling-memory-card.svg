<svg xmlns="http://www.w3.org/2000/svg" width="480" height="472" viewBox="0 0 480 472" role="img" aria-labelledby="title desc">
  <title id="title">每日一眼：temperature 与 top_p</title>
  <desc id="desc">温度调概率，Top-P 划范围。temperature 叫温度，三组柱状图比较同一组候选词“猫、狗、鸟”被抽中的概率：温度 0.2 时约为 92%、7%、1%，温度 0.7 时约为 57%、28%、15%，温度 1.0 时为 50%、30%、20%。低温突出第一名，高温让其他词也更有机会；所有候选词都保留。数值仅为示意，0.2 稳、0.7 日常、1.0 多样是经验起点。top_p 叫核采样阈值，绿色圆框圈住保留的候选；按概率从高到低累加，达到 p 就截住；1.0 不裁剪，0.95 或 0.9 缩小候选范围。一次先调一个，另一个保持默认，并确认模型支持。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #21314b; }
    .eyebrow { font-size: 12px; fill: #52627a; }
    .mnemonic { font-size: 21px; font-weight: 650; }
    .name { font-size: 18px; font-weight: 600; }
    .meaning { font-size: 16px; font-weight: 600; }
    .body { font-size: 14px; fill: #52627a; }
    .value { font-size: 16px; font-weight: 600; }
    .probability { font-size: 11px; font-weight: 600; text-anchor: middle; }
    .candidate { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .caption { font-size: 12px; fill: #52627a; }
    .note { font-size: 12px; fill: #52627a; }
    .temperature { fill: #304fb4; }
    .nucleus { fill: #255b40; }
  </style>

  <rect x="0.5" y="0.5" width="479" height="471" rx="16" fill="#ffffff" stroke="#c9d1df"/>
  <text class="eyebrow" x="22" y="27">每日一眼 · 采样参数</text>
  <text class="mnemonic" x="22" y="55">温度调概率，Top-P 划范围</text>

  <rect x="14" y="72" width="452" height="246" rx="10" fill="#edf2ff"/>
  <text class="name temperature" x="28" y="98">temperature</text>
  <text class="meaning temperature" x="163" y="98">温度</text>
  <text class="caption" x="452" y="98" text-anchor="end">概率示意</text>
  <text class="body" x="28" y="122">同一组候选词，柱高表示被抽中的概率</text>
  <g fill="#ffffff">
    <rect x="28" y="136" width="134" height="150" rx="7"/>
    <rect x="173" y="136" width="134" height="150" rx="7"/>
    <rect x="318" y="136" width="134" height="150" rx="7"/>
  </g>
  <text class="value temperature" x="43" y="159">0.2 稳</text>
  <text class="value temperature" x="188" y="159">0.7 日常</text>
  <text class="value temperature" x="333" y="159">1.0 多样</text>

  <!-- 同一基准分布 0.5 / 0.3 / 0.2 按 p^(1/T) 归一化；柱高共用 70px = 100% 的刻度。 -->
  <g aria-hidden="true">
    <path d="M43 244 H147 M188 244 H292 M333 244 H437" fill="none" stroke="#dbe2ef"/>
    <g fill="#3e63dd">
      <rect x="49" y="179.7" width="18" height="64.3" rx="2"/>
      <rect x="194" y="204" width="18" height="40" rx="2"/>
      <rect x="339" y="209" width="18" height="35" rx="2"/>
    </g>
    <g fill="#bd682b">
      <rect x="86" y="239" width="18" height="5" rx="1"/>
      <rect x="231" y="224.7" width="18" height="19.3" rx="2"/>
      <rect x="376" y="223" width="18" height="21" rx="2"/>
    </g>
    <g fill="#8464b6">
      <rect x="123" y="243.3" width="18" height="0.7" rx="0.35"/>
      <rect x="268" y="233.2" width="18" height="10.8" rx="2"/>
      <rect x="413" y="230" width="18" height="14" rx="2"/>
    </g>
  </g>
  <g class="probability">
    <text x="58" y="173">92%</text>
    <text x="95" y="232">7%</text>
    <text x="132" y="236">1%</text>
    <text x="203" y="197">57%</text>
    <text x="240" y="218">28%</text>
    <text x="277" y="226">15%</text>
    <text x="348" y="202">50%</text>
    <text x="385" y="216">30%</text>
    <text x="422" y="223">20%</text>
  </g>
  <g class="candidate">
    <text x="58" y="266" style="fill: #3e63dd">猫</text>
    <text x="95" y="266" style="fill: #bd682b">狗</text>
    <text x="132" y="266" style="fill: #8464b6">鸟</text>
    <text x="203" y="266" style="fill: #3e63dd">猫</text>
    <text x="240" y="266" style="fill: #bd682b">狗</text>
    <text x="277" y="266" style="fill: #8464b6">鸟</text>
    <text x="348" y="266" style="fill: #3e63dd">猫</text>
    <text x="385" y="266" style="fill: #bd682b">狗</text>
    <text x="422" y="266" style="fill: #8464b6">鸟</text>
  </g>
  <text class="caption" x="28" y="307">低温突出第一名 → 高温让其他词也更有机会</text>

  <g transform="translate(0 132)">
  <rect x="14" y="196" width="452" height="108" rx="10" fill="#e6f4ed"/>
  <text class="name nucleus" x="28" y="222">top_p</text>
  <text class="meaning nucleus" x="93" y="222">核采样阈值</text>
  <g aria-hidden="true">
    <rect x="330" y="209" width="76" height="18" rx="9" fill="none" stroke="#397857"/>
    <g fill="#397857">
      <circle cx="343" cy="218" r="4"/>
      <circle cx="359" cy="218" r="4"/>
      <circle cx="375" cy="218" r="4"/>
      <circle cx="391" cy="218" r="4"/>
    </g>
    <circle cx="423" cy="218" r="4" fill="#bac9c0"/>
    <circle cx="439" cy="218" r="4" fill="#bac9c0"/>
  </g>
  <text class="body" x="28" y="247">按概率从高到低累加，达到 p 就截住</text>
  <g fill="#ffffff">
    <rect x="28" y="260" width="150" height="30" rx="7"/>
    <rect x="190" y="260" width="262" height="30" rx="7"/>
  </g>
  <text class="value nucleus" x="43" y="281">1.0 不裁剪</text>
  <text class="value nucleus" x="205" y="281">0.95 / 0.9 收窄候选</text>
  </g>

  <text class="note" x="22" y="457">经验起点 · 一次先调一个 · 以模型支持为准</text>
</svg>
