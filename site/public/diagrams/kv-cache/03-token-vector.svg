<svg xmlns="http://www.w3.org/2000/svg" width="520" height="565" viewBox="0 0 520 565" role="img" aria-labelledby="title desc">
<title id="title">文本、token 与数字向量</title>
<desc id="desc">消息先通过模型的聊天模板与分词变为 token ID，再转为数字向量，经模型各层产生 Q/K/V。示意 ID 不对应某个实际分词器。</desc>
<style>
  .canvas{fill:#fff}.panel{fill:#f4f6fa;stroke:#c9d1df}
  .reuse{fill:#e6f4ed;stroke:#488365}.new{fill:#eaf1ff;stroke:#5779ba}
  .change{fill:#fff1dc;stroke:#ab742c}.blocked{fill:#eef0f4;stroke:#c6cdd7}
  rect{stroke-width:1.5}text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#21314b;font-size:24px}
  .title{font-size:27px;font-weight:650}.small{font-size:21px}.bold{font-weight:650}
  .arrow{fill:none;stroke:#71809a;stroke-width:2;marker-end:url(#arrow)}
  .line{fill:none;stroke:#71809a;stroke-width:2}
  @media(prefers-color-scheme:dark){
    .canvas{fill:#151e2b}.panel{fill:#222e40;stroke:#52617a}
    .reuse{fill:#1d3d32;stroke:#70b28e}.new{fill:#263958;stroke:#83a7e4}
    .change{fill:#493724;stroke:#c9a366}.blocked{fill:#293141;stroke:#566174}
    text{fill:#edf2fa}.arrow,.line{stroke:#9aa9c0}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71809a"/></marker></defs>
<rect class="canvas" x="0" y="0" width="520" height="565" rx="16"/>
<text x="28" y="43" class="title" text-anchor="start">文本、token 与数字向量</text>
<rect x="28" y="76" width="464" height="74" rx="12" class="new"/><text x="48" y="107" class="bold" text-anchor="start">消息：role + content</text><text x="48" y="135" class="small" text-anchor="start">例如 user 说了一句 hello</text><path class="arrow" d="M260 156 L260 180"/><rect x="28" y="190" width="464" height="74" rx="12" class="panel"/><text x="48" y="221" class="bold" text-anchor="start">聊天模板与分词</text><text x="48" y="249" class="small" text-anchor="start">角色边界和文字 → token ID 序列</text><path class="arrow" d="M260 270 L260 294"/><rect x="28" y="304" width="464" height="74" rx="12" class="panel"/><text x="48" y="335" class="bold" text-anchor="start">token ID → 数字向量</text><text x="48" y="363" class="small" text-anchor="start">示意：[31, 72] → [[…], […]]</text><path class="arrow" d="M260 384 L260 408"/><rect x="28" y="418" width="464" height="74" rx="12" class="reuse"/><text x="48" y="449" class="bold" text-anchor="start">经过每一层的模型计算</text><text x="48" y="477" class="small" text-anchor="start">这一层产生对应的 Q / K / V</text><text x="28" y="532" class="small" text-anchor="start">ID 与数组仅示意，不是实测分词。</text>
</svg>
