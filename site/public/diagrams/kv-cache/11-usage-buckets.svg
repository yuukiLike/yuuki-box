<svg xmlns="http://www.w3.org/2000/svg" width="520" height="555" viewBox="0 0 520 555" role="img" aria-labelledby="title desc">
<title id="title">同一批 token，换一种分桶方式</title>
<desc id="desc">假设 DeepSeek 总输入一万，其中八千命中、两千未命中，输出一百。Pi cacheRead 为八千，input 为两千，cacheWrite 为零，总量一万零一百。缓存命中仍计入上下文规模。</desc>
<style>
  .canvas{fill:#fff}.panel{fill:#f4f6fa;stroke:#c9d1df}
  .reuse{fill:#e6f4ed;stroke:#488365}.new{fill:#eaf1ff;stroke:#5779ba}
  .change{fill:#fff1dc;stroke:#ab742c}.blocked{fill:#eef0f4;stroke:#c6cdd7}
  rect{stroke-width:1.5}text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#21314b;font-size:24px}
  .title{font-size:27px;font-weight:650}.small{font-size:21px}.bold{font-weight:650}
  .arrow{fill:none;stroke:#71809a;stroke-width:2;marker-end:url(#arrow)}
  .line{fill:none;stroke:#71809a;stroke-width:2}
  @media(prefers-color-scheme:dark){
    .canvas{fill:#151e2b}.panel{fill:#222e40;stroke:#52617a}
    .reuse{fill:#1d3d32;stroke:#70b28e}.new{fill:#263958;stroke:#83a7e4}
    .change{fill:#493724;stroke:#c9a366}.blocked{fill:#293141;stroke:#566174}
    text{fill:#edf2fa}.arrow,.line{stroke:#9aa9c0}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71809a"/></marker></defs>
<rect class="canvas" x="0" y="0" width="520" height="555" rx="16"/>
<text x="28" y="43" class="title" text-anchor="start">同一批 token，换一种分桶方式</text>
<text x="28" y="94" class="bold" text-anchor="start">DeepSeek：全部输入 10,000</text><rect x="28" y="118" width="371" height="70" rx="0" class="reuse"/><rect x="399" y="118" width="93" height="70" rx="0" class="change"/><text x="214" y="161" class="bold" text-anchor="middle">命中 8,000</text><text x="445" y="161" class="small" text-anchor="middle">2,000</text><text x="28" y="225" class="small" text-anchor="start">未命中 2,000 也是输入的一部分。</text><path class="arrow" d="M260 246 L260 280"/><rect x="28" y="292" width="464" height="88" rx="12" class="new"/><text x="48" y="323" class="bold" text-anchor="start">Pi：把输入分成不同的桶</text><text x="48" y="351" class="small" text-anchor="start">cacheRead = 8,000；input = 2,000</text><rect x="28" y="402" width="464" height="74" rx="12" class="panel"/><text x="48" y="433" class="bold" text-anchor="start">这次还有输出 100</text><text x="48" y="461" class="small" text-anchor="start">总量 = 8,000 + 2,000 + 100 = 10,100</text><text x="28" y="520" class="small" text-anchor="start">本例未报告缓存写入，数字均为假设。</text>
</svg>
