<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">故障演练先把控制流程测稳</title>
<desc id="desc">故障演练先把控制流程测稳。模型即使提出危险调用，执行策略仍应拦住；测试要检查实际动作。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">故障演练先把控制流程测稳</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">固定输入验证 Harness 的行为；模型回答质量另做评估。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">1 · 可控的输入</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">慢响应、断流、拒绝</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">假模型与假工具</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">固定时间与测试目录</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">2 · 真实的控制层</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">取消向下传递</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">权限与大小限制</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">运行和工具各记状态</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">3 · 可核对的结果</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">最终状态与事件</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">是否发生未授权写入</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">新进程能否恢复</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">模型即使提出危险调用，执行策略仍应拦住；测试要检查实际动作。</text>
</g></svg>
