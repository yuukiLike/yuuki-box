<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">Skill 分三层进入上下文</title>
<desc id="desc">Skill 分三层进入上下文。写进 Skill 的命令不会自动获得执行权限。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">Skill 分三层进入上下文</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">先判断适用，再读步骤，最后按需取资料；工具权限仍由执行环境检查。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">1 · 名称与描述</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">当前任务是否匹配？</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">先做选择</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">无需载入全部材料</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">2 · SKILL.md 正文</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">读取工作步骤</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">明确输入与交付</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">知道什么时候结束</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">3 · 引用与脚本</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">遇到具体步骤再读取</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">脚本执行固定检查</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">结果回到任务记录</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">写进 Skill 的命令不会自动获得执行权限。</text>
</g></svg>
