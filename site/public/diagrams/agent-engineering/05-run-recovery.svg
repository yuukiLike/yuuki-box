<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">运行结束，不等于工具结果已知</title>
<desc id="desc">运行结束，不等于工具结果已知。崩溃恢复要启动新进程，读取同一份落盘记录；内存 Store 无法证明恢复。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="670" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">运行结束，不等于工具结果已知</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">Run 和 ToolCall 分别记状态；重启后从持久记录恢复判断。</text>
<text x="40" y="133" font-size="21" fill="#245b86" font-weight="650">运行层：用户按取消</text><rect x="40" y="148" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="190" font-size="24" fill="#245b86" font-weight="650">running</text><text x="62" y="230" font-size="20" fill="#455164" font-weight="400">正在等待模型或工具</text><path d="M348 238 L364 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="148" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="190" font-size="24" fill="#806014" font-weight="650">cancelling</text><text x="390" y="230" font-size="20" fill="#455164" font-weight="400">传递取消信号</text><text x="390" y="260" font-size="20" fill="#455164" font-weight="400">停止安排后续工作</text><path d="M676 238 L692 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="148" width="304" height="180" rx="16" fill="#f5f6f8" stroke="#c6cbd3" stroke-width="1.5"/><text x="718" y="190" font-size="24" fill="#4a5362" font-weight="650">cancelled</text><text x="718" y="230" font-size="20" fill="#455164" font-weight="400">记录运行终态</text><text x="718" y="260" font-size="20" fill="#455164" font-weight="400">不覆盖已完成的工具</text><text x="40" y="379" font-size="21" fill="#245b86" font-weight="650">工具层：外部写入后连接断开</text><rect x="40" y="394" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="436" font-size="24" fill="#245b86" font-weight="650">running</text><text x="62" y="476" font-size="20" fill="#455164" font-weight="400">已把调用交给执行方</text><path d="M348 484 L364 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="394" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="436" font-size="24" fill="#806014" font-weight="650">unknown</text><text x="390" y="476" font-size="20" fill="#455164" font-weight="400">未拿到可靠回执</text><text x="390" y="506" font-size="20" fill="#455164" font-weight="400">不能直接当作失败</text><path d="M676 484 L692 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="394" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="436" font-size="24" fill="#23674a" font-weight="650">核对后再决定</text><text x="718" y="476" font-size="20" fill="#455164" font-weight="400">查询外部执行记录</text><text x="718" y="506" font-size="20" fill="#455164" font-weight="400">或使用幂等约定</text><text x="718" y="536" font-size="20" fill="#455164" font-weight="400">不要直接重放写入</text><text x="40" y="625" font-size="21" fill="#455164" font-weight="400">崩溃恢复要启动新进程，读取同一份落盘记录；内存 Store 无法证明恢复。</text>
</g></svg>
