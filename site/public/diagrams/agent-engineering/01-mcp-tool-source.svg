<svg xmlns="http://www.w3.org/2000/svg" width="800" height="930" viewBox="0 0 800 930" role="img" aria-labelledby="title desc">
<title id="title">外部调用：先记录，再发出</title>
<desc id="desc">模型提出工具调用，Harness 检查来源、参数和权限并保存执行意图，再通过 MCP 调用外部服务。正常结果检查限额并保存回执；请求已发出后断连且效果无法确认时记录 unknown，运行进入 interrupted，先对账再决定后续动作。</desc>
<rect width="800" height="930" rx="18" fill="#ffffff"/>
<text x="32" y="49" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="650" fill="#20324d" text-anchor="start">外部调用：先记录，再发出</text>
<text x="32" y="86" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start">设计练习 · 图中 ToolSource 尚未接入当前 runtime。</text>
<rect x="32" y="118" width="736" height="77" rx="12" fill="#e9f6ef" stroke="#91bda4" stroke-width="1.5"/>
<text x="52" y="153" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#275b40" text-anchor="start">你来做：接只读工具源 → 读取 README → 故意断连</text>
<rect x="200" y="234" width="400" height="80" rx="12" fill="#f4f7fb" stroke="#d2dce8" stroke-width="1.5"/>
<text x="220" y="269" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#20324d" text-anchor="start">模型提出一个工具调用</text>
<polyline points="400,314 400,352" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="404.55,345.0 400,352 395.45,345.0" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="32" y="358" width="736" height="142" rx="12" fill="#edf3ff" stroke="#9fb7dd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="52" y="389" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#2e5185" text-anchor="start">Harness 继续负责</text>
<rect x="52" y="408" width="310" height="72" rx="12" fill="#ffffff" stroke="#cad5e3" stroke-width="1.5"/>
<text x="72" y="443" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#20324d" text-anchor="start">检查来源、参数与权限</text>
<polyline points="371,444 418,444" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="411.0,439.45 418,444 411.0,448.55" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="428" y="408" width="320" height="72" rx="12" fill="#ffffff" stroke="#cad5e3" stroke-width="1.5"/>
<text x="448" y="443" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#20324d" text-anchor="start">先保存执行意图 intent</text>
<polyline points="400,500 400,542" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="404.55,535.0 400,542 395.45,535.0" fill="none" stroke="#8193ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="180" y="548" width="440" height="92" rx="12" fill="#edf3ff" stroke="#9fb7dd" stroke-width="1.5"/>
<text x="200" y="583" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#2e5185" text-anchor="start">MCP client → 工具 server</text>
<text x="200" y="615" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#2e5185" text-anchor="start">请求已经发出</text>
<polyline points="400,640 400,662 204,662 204,700" fill="none" stroke="#275b40" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="208.55,693.0 204,700 199.45,693.0" fill="none" stroke="#275b40" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="400,662 596,662 596,700" fill="none" stroke="#76551d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="600.55,693.0 596,700 591.45,693.0" fill="none" stroke="#76551d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="32" y="706" width="344" height="127" rx="12" fill="#e9f6ef" stroke="#91bda4" stroke-width="1.5"/>
<text x="52" y="741" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#275b40" text-anchor="start">收到可核对的结果</text>
<text x="52" y="773" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#275b40" text-anchor="start">检查限额，保存回执</text>
<text x="52" y="802" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#275b40" text-anchor="start">把有界内容交回模型</text>
<rect x="424" y="706" width="344" height="127" rx="12" fill="#fff6e4" stroke="#d9b66a" stroke-width="1.5"/>
<text x="444" y="741" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#76551d" text-anchor="start">断连，执行效果无法确认</text>
<text x="444" y="773" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#76551d" text-anchor="start">unknown · interrupted</text>
<text x="444" y="802" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#76551d" text-anchor="start">先对账，再决定下一步</text>
<text x="32" y="872" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#20324d" text-anchor="start">恢复时不自动重放不确定的副作用。</text>
<text x="32" y="909" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#52657c" text-anchor="start">已发出请求的取消：本地结束等待，服务端效果仍需核对。</text>
</svg>
