<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">保存的历史与发给模型的上下文</title>
<desc id="desc">保存的历史与发给模型的上下文。缩小请求上下文，不等于静默删除历史；token 估算也不等于计费回执。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="450" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">保存的历史与发给模型的上下文</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">历史用于追溯；本次请求只装入能容纳且与任务有关的部分。</text>
<rect x="40" y="134" width="464" height="222" rx="16" fill="#f5f6f8" stroke="#c6cbd3" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#4a5362" font-weight="650">历史与工件：可追溯</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">运行事件、工具调用与产物引用</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">按保留策略归档或清理</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">超限结果要在接收阶段截住</text><text x="62" y="306" font-size="20" fill="#455164" font-weight="400">缺失部分明确标记为不完整</text><rect x="536" y="134" width="464" height="222" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="558" y="176" font-size="24" fill="#245b86" font-weight="650">本次上下文：有预算</text><text x="558" y="216" font-size="20" fill="#455164" font-weight="400">系统约束 + 当前任务</text><text x="558" y="246" font-size="20" fill="#455164" font-weight="400">选中的对话、摘要与工具结果</text><text x="558" y="276" font-size="20" fill="#455164" font-weight="400">预留输出和工具往返空间</text><text x="558" y="306" font-size="20" fill="#455164" font-weight="400">记录选择、裁剪与估算依据</text><text x="40" y="405" font-size="21" fill="#455164" font-weight="400">缩小请求上下文，不等于静默删除历史；token 估算也不等于计费回执。</text>
</g></svg>
