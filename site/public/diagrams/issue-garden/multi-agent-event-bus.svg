<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">多 AI 协作：事件进入，任务调度，结果核对</title>
  <desc id="desc">GitHub、聊天和 Hook 的事件经接收与去重进入协调器。协调器在数据库持久化事件、任务与待发记录，调度独立任务的编码 AI，以及候选提交的只读审查与测试。结果回传后核对租约和代码版本，再发布草稿 PR，等待人工验收。失败最多返修两轮。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; fill: #475569; }
      .label { font-size: 15px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="640" rx="20" fill="#fbfcfe"/>
  <text x="40" y="48" font-size="30" font-weight="700">多个 AI，围绕同一套事件与任务状态协作</text>
  <text x="40" y="82" class="body">Webhook 接入口 · EventBus 发通知 · 数据库保存事实</text>
  <rect x="40" y="164" width="164" height="120" rx="16" fill="#f0fdf4" stroke="#86cba4"/>
  <text x="58" y="204" class="heading">事件入口</text>
  <text x="58" y="238" class="body">GitHub / 聊天</text>
  <text x="58" y="264" class="body">用户指令 / Hook</text>
  <path d="M204 224H236" class="line" marker-end="url(#arrow)"/>
  <rect x="244" y="164" width="172" height="120" rx="16" fill="#eef6ff" stroke="#93bee8"/>
  <text x="262" y="204" class="heading">接收与去重</text>
  <text x="262" y="238" class="body">验签 · 归一化</text>
  <text x="262" y="264" class="body">eventId / taskId</text>
  <path d="M416 224H448" class="line" marker-end="url(#arrow)"/>
  <rect x="456" y="142" width="272" height="202" rx="18" fill="#edf7ff" stroke="#75acd9" stroke-width="2"/>
  <text x="478" y="181" class="heading">协调器 + 持久状态</text>
  <text x="478" y="217" class="body">events · tasks · outbox</text>
  <text x="478" y="248" class="body">事务落库 → EventBus 通知</text>
  <text x="478" y="279" class="body">领取租约 · 核对代码版本</text>
  <text x="478" y="317" class="label">Agent 提结果，协调器推进状态</text>
  <text x="790" y="103" class="label">独立任务并发，同一候选版本并行只读</text>
  <path d="M728 224H754V162H782M754 224V275H782M754 275V388H782" class="line"/>
  <path d="M754 162H782" class="line" marker-end="url(#arrow)"/>
  <path d="M754 275H782" class="line" marker-end="url(#arrow)"/>
  <path d="M754 388H782" class="line" marker-end="url(#arrow)"/>
  <rect x="790" y="122" width="264" height="80" rx="14" fill="#fff1f7" stroke="#df9cbd"/>
  <text x="808" y="153" class="heading">AI A · 编码任务 12</text>
  <text x="808" y="183" class="body">独立目录与分支 → 候选 H2</text>
  <rect x="790" y="235" width="264" height="80" rx="14" fill="#f5f1ff" stroke="#b9a5df"/>
  <text x="808" y="266" class="heading">审查 AI + 测试 Worker</text>
  <text x="808" y="296" class="body">候选出现后，固定 H2 只读</text>
  <rect x="790" y="348" width="264" height="80" rx="14" fill="#edf9f1" stroke="#94c9a5"/>
  <text x="808" y="379" class="heading">AI B · 编码任务 24</text>
  <text x="808" y="409" class="body">另一个任务，独立目录与分支</text>
  <path d="M1054 162H1080V492H660V344" class="line" marker-end="url(#arrow)"/>
  <path d="M1054 275H1080M1054 388H1080" class="line"/>
  <text x="799" y="479" class="label">结果事件回传；失败有限返修</text>
  <path d="M520 344V445H424" class="line" marker-end="url(#arrow)"/>
  <text x="446" y="392" class="label">当前版本通过</text>
  <rect x="40" y="395" width="376" height="102" rx="16" fill="#fff8eb" stroke="#dcc28b"/>
  <text x="60" y="433" class="heading">草稿 PR → 人验收</text>
  <text x="60" y="468" class="body">邮件 / 界面只订阅已确认的结果</text>
  <rect x="40" y="536" width="1040" height="76" rx="14" fill="#eff3f8"/>
  <text x="60" y="566" font-size="18" font-weight="600">旧租约、旧 head 的结果只留档；不能推进发布。</text>
  <text x="60" y="594" class="body">经验改进：失败样本 → 回归用例 → 候选规则 → 人确认后版本化　｜　待实现设计</text>
</svg>
