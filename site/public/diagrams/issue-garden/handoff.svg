<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">一次交班，把任务与结果对上</title>
<desc id="desc">一次交班，把任务与结果对上。运行中互斥靠并发控制；跨天去重还要查关联任务与 PR。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">一次交班，把任务与结果对上</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">自动化的输入是一个已授权 Issue，输出是一份可审阅的草稿 PR。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">选择与去重</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">筛选 ai-ready</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">查已有任务与 PR</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">记录 Issue 与基线 SHA</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">修改与独立验证</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">固定安装和检查命令</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">保留补丁与结果</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">失败就记录具体缺口</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">发布与交接</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">仅发布已验证的补丁</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">PR 对应最终提交</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">等待验收与合并决定</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">运行中互斥靠并发控制；跨天去重还要查关联任务与 PR。</text>
</g></svg>
