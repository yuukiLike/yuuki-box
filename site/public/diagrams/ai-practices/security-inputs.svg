<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">安全修复要看两边的输入</title>
<desc id="desc">安全修复要看两边的输入。关闭扫描、跳过代码或删掉断言，不能证明漏洞已修复。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="450" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">安全修复要看两边的输入</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">保持检测规则有效，同时验证攻击路径与正常功能。</text>
<rect x="40" y="134" width="464" height="222" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#953959" font-weight="650">危险输入：被阻止</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">构造与告警对应的触发条件</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">确认数据到危险操作的路径</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">修复后危险动作不能发生</text><rect x="536" y="134" width="464" height="222" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="558" y="176" font-size="24" fill="#23674a" font-weight="650">正常输入：仍可用</text><text x="558" y="216" font-size="20" fill="#455164" font-weight="400">使用原来合法的业务输入</text><text x="558" y="246" font-size="20" fill="#455164" font-weight="400">检查返回值与副作用</text><text x="558" y="276" font-size="20" fill="#455164" font-weight="400">修复后正常流程仍能完成</text><text x="40" y="405" font-size="21" fill="#455164" font-weight="400">关闭扫描、跳过代码或删掉断言，不能证明漏洞已修复。</text>
</g></svg>
