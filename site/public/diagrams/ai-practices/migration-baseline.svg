<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">迁移先建立可比较的基线</title>
<desc id="desc">迁移先建立可比较的基线。编译通过是一项证据；行为兼容、数据与部署条件仍要按范围核对。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">迁移先建立可比较的基线</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">每次只处理一个明确升级目标，避免把原有问题算作迁移结果。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">旧环境</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">保存版本与锁文件</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">记录现有检查结果</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">记下已经失败的项</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#806014" font-weight="650">目标环境</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">只改必要配置与接口</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">重复同一组检查</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">定位新增失败</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">完成对照</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">新增失败得到解释</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">关键行为符合约定</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">交付可回退的改动</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">编译通过是一项证据；行为兼容、数据与部署条件仍要按范围核对。</text>
</g></svg>
