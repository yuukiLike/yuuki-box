<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">把审查意见变成可验证的问题</title>
<desc id="desc">把审查意见变成可验证的问题。评论被采纳不等于发现了缺陷；能复现的行为才是修复依据。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">把审查意见变成可验证的问题</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">先核实一条意见，再决定是否修改。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">指出触发条件</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">哪个输入或状态？</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">对应哪段代码？</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#806014" font-weight="650">复现或反证</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">沿调用方检查</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">运行最小反例</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">记录缺失条件</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">作出处理决定</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">修复已确认的问题</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">解释误报</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">保留需要取舍的点</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">评论被采纳不等于发现了缺陷；能复现的行为才是修复依据。</text>
</g></svg>
