<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">让测试证明自己能抓住错误</title>
<desc id="desc">让测试证明自己能抓住错误。覆盖率能帮助找盲区；有效的断言才能区分正确行为与错误行为。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">让测试证明自己能抓住错误</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">在临时工作区做对照，并恢复正确实现。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#23674a" font-weight="650">正确实现：通过</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">测试能稳定运行</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">断言对应真实需求</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">已知错误：失败</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">只重新引入目标 bug</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">因目标断言而失败</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">排除环境性失败</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">恢复实现：通过</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">移除错误变体</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">重新运行同一测试</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">检查最终 diff</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">覆盖率能帮助找盲区；有效的断言才能区分正确行为与错误行为。</text>
</g></svg>
