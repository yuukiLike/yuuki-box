<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">从 Issue 到一份能验收的 PR</title>
<desc id="desc">从 Issue 到一份能验收的 PR。能创建 PR 说明交付到了入口；任务是否解决，要看原问题是否消失。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">从 Issue 到一份能验收的 PR</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">先限定一个问题；合并判断依据改动和证据。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">Issue：定义问题</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">触发条件与复现步骤</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">期望结果</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">本次不扩展的范围</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#953959" font-weight="650">实现：改动与检查</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">记录基线提交</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">修改相关路径</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">重跑同一复现步骤</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">PR：交回证据</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">行为发生了什么变化</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">哪些检查已通过</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">哪些还需实际验收</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">能创建 PR 说明交付到了入口；任务是否解决，要看原问题是否消失。</text>
</g></svg>
