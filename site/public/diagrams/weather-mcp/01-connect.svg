<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">在 Codex 中连接天气服务</title>
<desc id="desc">原创桌面界面示意。天气插件详情包含连接按钮。用户连接账号，在浏览器登录同意，回到对话查询天气。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8aa9ad"/></marker></defs>
<rect width="1400" height="840" fill="#101010"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><rect x="20" y="20" width="1360" height="800" rx="20" fill="#1e1e1e" stroke="#404040"/><path d="M40 20h204v800H40a20 20 0 0 1-20-20V40a20 20 0 0 1 20-20Z" fill="#181818"/><circle cx="47" cy="48" r="6" fill="#ed6a5f"/><circle cx="69" cy="48" r="6" fill="#f4bd4f"/><circle cx="91" cy="48" r="6" fill="#61c454"/><text x="44" y="113" font-size="27" fill="#e7e7e7" font-weight="600" >Codex</text><text x="53" y="174" font-size="21" fill="#a1a1a1" font-weight="400" >新对话</text><text x="53" y="222" font-size="21" fill="#a1a1a1" font-weight="400" >自动化</text><rect x="34" y="241" width="194" height="44" rx="9" fill="#2b2b2b" stroke="none"/><text x="53" y="270" font-size="21" fill="#eeeeee" font-weight="400" >插件</text><text x="45" y="346" font-size="16" fill="#737373" font-weight="400" >最近</text><text x="45" y="388" font-size="18" fill="#b5b5b5" font-weight="400" >天气服务接入</text><text x="45" y="432" font-size="18" fill="#909090" font-weight="400" >我的工作台</text><path d="M39 730 L227 730" stroke="#373737" fill="none" /><circle cx="57" cy="771" r="17" fill="#373737"/><text x="50" y="778" font-size="18" fill="#e7e7e7" font-weight="400" >Y</text><text x="86" y="778" font-size="18" fill="#bababa" font-weight="400" >Yuuki</text><text x="282" y="59" font-size="21" fill="#e7e7e7" font-weight="500" >插件 / 天气服务</text><text x="282" y="96" font-size="17" fill="#959595" font-weight="400" >把天气查询接入当前对话</text><path d="M244 116 L1380 116" stroke="#373737" fill="none" /><rect x="308" y="155" width="1005" height="542" rx="18" fill="#222222" stroke="#353535"/><rect x="342" y="192" width="84" height="84" rx="20" fill="#303030" stroke="none"/><g transform="translate(352 205) scale(1)" fill="none" stroke-width="2.5" stroke-linecap="round">
    <circle cx="25" cy="21" r="11" stroke="#dccb96"/>
    <path d="M25 2v4 M25 36v4 M6 21h4 M41 21h4 M11 7l3 3 M36 7l-3 3" stroke="#dccb96"/>
    <path d="M21 45h31a9 9 0 0 0 0-18 13 13 0 0 0-25-1 10 10 0 0 0-6 19Z" fill="#292929" stroke="#ddd"/>
    </g><text x="453" y="224" font-size="34" fill="#e7e7e7" font-weight="600" >天气服务</text><text x="453" y="261" font-size="20" fill="#a5a5a5" font-weight="400" >由你提供 · 数据来自 Apple WeatherKit</text><rect x="1131" y="211" width="143" height="48" rx="24" fill="#ededed" stroke="none"/><text x="1177" y="243" font-size="22" fill="#202020" font-weight="600" >连接</text><path d="M342 310 L1276 310" stroke="#373737" fill="none" /><text x="347" y="359" font-size="26" fill="#e7e7e7" font-weight="400" >直接问一句，就能查询当前天气。</text><text x="347" y="401" font-size="21" fill="#a6a6a6" font-weight="400" >支持上海、北京、杭州；结果包含时间、单位与来源。</text><rect x="346" y="438" width="929" height="70" rx="12" fill="#292929" stroke="none"/><text x="372" y="482" font-size="24" fill="#d7d7d7" font-weight="400" >“用天气服务查一下上海现在的天气。”</text><text x="347" y="563" font-size="18" fill="#858585" font-weight="400" >首次使用</text><text x="347" y="606" font-size="23" fill="#e7e7e7" font-weight="400" >连接账号</text><text x="540" y="606" font-size="23" fill="#7e7e7e" font-weight="400" >→</text><text x="607" y="606" font-size="23" fill="#e7e7e7" font-weight="400" >浏览器登录并同意</text><text x="933" y="606" font-size="23" fill="#7e7e7e" font-weight="400" >→</text><text x="1000" y="606" font-size="23" fill="#e7e7e7" font-weight="400" >回到对话</text><text x="347" y="656" font-size="19" fill="#949494" font-weight="400" >连接完成后，客户端会处理 token 的交换与携带。</text><text x="282" y="789" font-size="17" fill="#aaa" font-weight="400" >01 / 04</text><text x="410" y="789" font-size="16" fill="#777" font-weight="400" >原创界面示意 · 非真实截图 · 按钮位置不代表具体版本</text></g>
</svg>
