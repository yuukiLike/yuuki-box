<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">天气请求的身份、资格与额度检查</title>
<desc id="desc">天气请求的身份、资格与额度检查。用户 ID 来自已验证 token；模型参数只选择城市，不能代替身份或授权。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="410" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">天气请求的身份、资格与额度检查</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">公开元数据用于连接发现；实际 MCP 请求和工具调用另行检查。</text>
<rect x="40" y="134" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="176" font-size="24" fill="#245b86" font-weight="650">1 · 身份</text><text x="62" y="216" font-size="20" fill="#455164" font-weight="400">verifyWeatherUser</text><text x="62" y="246" font-size="20" fill="#455164" font-weight="400">签名、issuer、aud</text><text x="62" y="276" font-size="20" fill="#455164" font-weight="400">过期或不符 → 401</text><path d="M348 224 L364 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="134" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="390" y="176" font-size="24" fill="#806014" font-weight="650">2 · 资格</text><text x="390" y="216" font-size="20" fill="#455164" font-weight="400">weather_access</text><text x="390" y="246" font-size="20" fill="#455164" font-weight="400">用户是否开通服务</text><text x="390" y="276" font-size="20" fill="#455164" font-weight="400">未开通或停用 → 403</text><path d="M676 224 L692 224" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="134" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="176" font-size="24" fill="#23674a" font-weight="650">3 · 额度</text><text x="718" y="216" font-size="20" fill="#455164" font-weight="400">reserve_weather_call</text><text x="718" y="246" font-size="20" fill="#455164" font-weight="400">原子预占一次尝试</text><text x="718" y="276" font-size="20" fill="#455164" font-weight="400">通过后才请求 Apple</text><text x="40" y="366" font-size="21" fill="#455164" font-weight="400">用户 ID 来自已验证 token；模型参数只选择城市，不能代替身份或授权。</text>
</g></svg>
