<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">两套 token，两段 HTTPS 请求</title>
<desc id="desc">用户在 Codex 询问上海天气。Codex 内部 MCP Client 用 Supabase 用户 token 请求天气 Edge Function，服务器检查身份资格额度，再用 Apple 开发者 token 请求 WeatherKit。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8aa9ad"/></marker></defs>
<rect width="1400" height="840" fill="#101010"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><rect x="20" y="20" width="1360" height="800" rx="20" fill="#1e1e1e" stroke="#404040"/><path d="M40 20h204v800H40a20 20 0 0 1-20-20V40a20 20 0 0 1 20-20Z" fill="#181818"/><circle cx="47" cy="48" r="6" fill="#ed6a5f"/><circle cx="69" cy="48" r="6" fill="#f4bd4f"/><circle cx="91" cy="48" r="6" fill="#61c454"/><text x="44" y="113" font-size="27" fill="#e7e7e7" font-weight="600" >Codex</text><rect x="34" y="145" width="194" height="44" rx="9" fill="#2b2b2b" stroke="none"/><text x="53" y="174" font-size="21" fill="#eeeeee" font-weight="400" >新对话</text><text x="53" y="222" font-size="21" fill="#a1a1a1" font-weight="400" >自动化</text><text x="53" y="270" font-size="21" fill="#a1a1a1" font-weight="400" >插件</text><text x="45" y="346" font-size="16" fill="#737373" font-weight="400" >最近</text><text x="45" y="388" font-size="18" fill="#b5b5b5" font-weight="400" >天气服务接入</text><text x="45" y="432" font-size="18" fill="#909090" font-weight="400" >工作台</text><path d="M39 730 L227 730" stroke="#373737" fill="none" /><circle cx="57" cy="771" r="17" fill="#373737"/><text x="50" y="778" font-size="18" fill="#e7e7e7" font-weight="400" >Y</text><text x="86" y="778" font-size="18" fill="#bababa" font-weight="400" >Yuuki</text><text x="282" y="59" font-size="21" fill="#e7e7e7" font-weight="500" >天气服务接入</text><text x="282" y="96" font-size="17" fill="#959595" font-weight="400" >对话中的一次查询，与后台真正发生的请求</text><path d="M244 116 L1380 116" stroke="#373737" fill="none" /><rect x="332" y="160" width="475" height="81" rx="18" fill="#303030" stroke="none"/><text x="360" y="210" font-size="24" fill="#e7e7e7" font-weight="400" >查一下上海现在的天气。</text><text x="310" y="303" font-size="26" fill="#e7e7e7" font-weight="500" >正在查询上海当前天气</text><rect x="309" y="333" width="496" height="79" rx="11" fill="#252525" stroke="#3b3b3b"/><circle cx="335" cy="373" r="5" fill="#b9c8be"/><text x="353" y="379" font-size="19" fill="#bfc4c0" font-weight="400" >weather · get_current_weather</text><text x="310" y="464" font-size="25" fill="#e7e7e7" font-weight="600" >Codex 是 Host</text><text x="310" y="506" font-size="21" fill="#a8a8a8" font-weight="400" >内部 MCP Client 负责协议通信。</text><text x="310" y="547" font-size="21" fill="#a8a8a8" font-weight="400" >天气能力由远程 MCP Server 提供。</text><rect x="308" y="634" width="497" height="78" rx="20" fill="#282828" stroke="#424242"/><text x="331" y="680" font-size="21" fill="#777777" font-weight="400" >继续提问…</text><path d="M849 144 L849 735" stroke="#373737" fill="none" /><text x="884" y="172" font-size="19" fill="#a6bfc1" font-weight="500" >教程观察栏</text><text x="884" y="200" font-size="16" fill="#838b8c" font-weight="400" >解释后台流程，不是 Codex 真实面板</text><rect x="883" y="226" width="443" height="70" rx="12" fill="#2b3030" stroke="#4b5a5b"/><text x="905" y="269" font-size="22" fill="#e7e7e7" font-weight="400" >Codex 内部 MCP Client</text><path d="M1104 302 L1104 358" stroke="#8aa9ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="887" y="337" font-size="18" fill="#b2cccc" font-weight="400" >① Supabase 用户 token</text><rect x="883" y="371" width="443" height="106" rx="12" fill="#282b29" stroke="#4d5b51"/><text x="905" y="410" font-size="22" fill="#e7e7e7" font-weight="400" >Supabase Edge Function</text><text x="905" y="450" font-size="19" fill="#a9bcae" font-weight="400" >验身份 → 查资格 → 预占额度</text><path d="M1104 486 L1104 542" stroke="#8aa9ad" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="887" y="521" font-size="18" fill="#b2cccc" font-weight="400" >② Apple 开发者 token</text><rect x="883" y="556" width="443" height="70" rx="12" fill="#2b2b2b" stroke="#474747"/><text x="905" y="599" font-size="22" fill="#e7e7e7" font-weight="400" >Apple WeatherKit REST API</text><text x="885" y="675" font-size="19" fill="#b4b4b4" font-weight="400" >两段 HTTPS，各自验证不同的凭证。</text><text x="885" y="709" font-size="19" fill="#8d8d8d" font-weight="400" >Apple 私钥仅保存在后端。</text><text x="282" y="789" font-size="17" fill="#aaa" font-weight="400" >03 / 04</text><text x="410" y="789" font-size="16" fill="#777" font-weight="400" >原创界面示意 · 非真实截图 · 按钮位置不代表具体版本</text></g>
</svg>
