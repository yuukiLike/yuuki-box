<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">检查用户实际看见的天气结果</title>
<desc id="desc">Codex 风格对话展示上海天气示例，包含温度、湿度、风速、数据时间、时区、Apple Weather 标识占位和来源链接。所有天气值为合成示例，不是真实数据。</desc>
