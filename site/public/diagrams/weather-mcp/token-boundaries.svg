<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">两套 token，各自只到对应的服务</title>
<desc id="desc">两套 token，各自只到对应的服务。用户 token 不转发给 Apple；Apple token 与私钥不进入工具结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6c8196" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="670" rx="20" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="32" fill="#243448" font-weight="700">两套 token，各自只到对应的服务</text>
<text x="40" y="94" font-size="20" fill="#455164" font-weight="400">Bearer 是携带格式；分别核对签发方、接收方与授权主体。</text>
<text x="40" y="133" font-size="21" fill="#245b86" font-weight="650">用户授权：访问天气服务</text><rect x="40" y="148" width="304" height="180" rx="16" fill="#eef7ff" stroke="#8fc9ed" stroke-width="1.5"/><text x="62" y="190" font-size="24" fill="#245b86" font-weight="650">Supabase Auth</text><text x="62" y="230" font-size="20" fill="#455164" font-weight="400">登录并记录用户同意</text><text x="62" y="260" font-size="20" fill="#455164" font-weight="400">签发 OAuth access token</text><path d="M348 238 L364 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="148" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="190" font-size="24" fill="#953959" font-weight="650">Codex 的 MCP Client</text><text x="390" y="230" font-size="20" fill="#455164" font-weight="400">持有用户 token</text><text x="390" y="260" font-size="20" fill="#455164" font-weight="400">随请求发给天气 MCP</text><path d="M676 238 L692 238" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="148" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="190" font-size="24" fill="#23674a" font-weight="650">天气 MCP</text><text x="718" y="230" font-size="20" fill="#455164" font-weight="400">验证签名与 audience</text><text x="718" y="260" font-size="20" fill="#455164" font-weight="400">识别用户</text><text x="718" y="290" font-size="20" fill="#455164" font-weight="400">再查业务资格和额度</text><text x="40" y="379" font-size="21" fill="#245b86" font-weight="650">服务身份：访问 Apple 天气接口</text><rect x="40" y="394" width="304" height="180" rx="16" fill="#fff8e8" stroke="#e5c977" stroke-width="1.5"/><text x="62" y="436" font-size="24" fill="#806014" font-weight="650">服务端 .p8 私钥</text><text x="62" y="476" font-size="20" fill="#455164" font-weight="400">只保存在后端</text><text x="62" y="506" font-size="20" fill="#455164" font-weight="400">用于 ES256 签名</text><path d="M348 484 L364 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="394" width="304" height="180" rx="16" fill="#fff0f6" stroke="#e9a4c3" stroke-width="1.5"/><text x="390" y="436" font-size="24" fill="#953959" font-weight="650">Edge Function</text><text x="390" y="476" font-size="20" fill="#455164" font-weight="400">生成 Apple token</text><text x="390" y="506" font-size="20" fill="#455164" font-weight="400">随天气请求发给 Apple</text><path d="M676 484 L692 484" fill="none" stroke="#6c8196" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="394" width="304" height="180" rx="16" fill="#edf8f2" stroke="#92cdb0" stroke-width="1.5"/><text x="718" y="436" font-size="24" fill="#23674a" font-weight="650">Apple WeatherKit</text><text x="718" y="476" font-size="20" fill="#455164" font-weight="400">验证开发者身份</text><text x="718" y="506" font-size="20" fill="#455164" font-weight="400">返回带时间与来源的数据</text><text x="40" y="625" font-size="21" fill="#455164" font-weight="400">用户 token 不转发给 Apple；Apple token 与私钥不进入工具结果。</text>
</g></svg>
